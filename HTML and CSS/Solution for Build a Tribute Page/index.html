<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tribute Page</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="main">

    <h1 id="title">Alan Turing</h1>

    <figure id="img-div">
      <img
        id="image"
        src="https://upload.wikimedia.org/wikipedia/commons/a/a1/Alan_Turing_Aged_16.jpg"
        alt="Alan Turing"
      >

      <figcaption id="img-caption">
        Alan Turing, matemático e pioneiro da ciência da computação.
      </figcaption>
    </figure>

    <div id="tribute-info">
      Alan Turing foi um matemático britânico conhecido por suas importantes contribuições para a computação, criptografia e inteligência artificial.
    </div>

    <a
      id="tribute-link"
      href="https://en.wikipedia.org/wiki/Alan_Turing"
      target="_blank"
    >
      Saiba mais sobre Alan Turing
    </a>

  </main>
</body>
</html>
